name: Prevent Generated Data Changes in PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  deny-generated-files:
    if: ${{ !startsWith(github.head_ref, 'automation/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install deps (fast)
        run: npm ci --no-audit --no-fund

      - name: Check for generated data changes
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx tsx scripts/check-generated-changes.ts
