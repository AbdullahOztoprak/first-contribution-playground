name: Update Votes

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  update-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run update votes script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/update-votes.ts
      - name: Open pull request for vote updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-votes
          delete-branch: true
          add-paths: |
            data/games.json
            data/leaderboard.json
          commit-message: 'chore: update votes and leaderboard'
          title: 'chore: update votes and leaderboard'
          body: |
            Automated vote and leaderboard refresh.
