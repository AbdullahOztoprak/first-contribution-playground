name: Regenerate Data On Main

on:
  workflow_dispatch:

jobs:
  regenerate-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild data
        run: npm run build:data

      - name: Open pull request for regenerated data
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/regenerate-data
          delete-branch: true
          add-paths: |
            data/games.json
            data/contributors.json
            data/leaderboard.json
          commit-message: 'chore(data): regenerate generated data'
          title: 'chore(data): regenerate generated data'
          body: |
            Automated data regeneration from the manual workflow.
