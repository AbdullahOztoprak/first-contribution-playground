# ============================================================
# CI Pipeline: Unified validation for all PRs
# Handles PR classification, validation, security scanning, and linting.
# ============================================================
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '24'

jobs:
  # ─────────────────────────────────────────────────────────
  # DETECT: What type of PR is this?
  # ─────────────────────────────────────────────────────────
  detect:
    name: Detect PR Type
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.detect.outputs.type }}
      category: ${{ steps.detect.outputs.category }}
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Detect submission type
        id: detect
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          if echo "$FILES" | grep -q '"games/'; then
            echo "type=game" >> "$GITHUB_OUTPUT"
            CATEGORY=$(echo "$FILES" | jq -r '[.[] | select(startswith("games/")) | split("/")[1]] | unique | if length == 1 then .[0] else "" end')
            echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          elif echo "$FILES" | grep -q '"translations/'; then
            echo "type=translation" >> "$GITHUB_OUTPUT"
            echo "category=" >> "$GITHUB_OUTPUT"
          else
            echo "type=other" >> "$GITHUB_OUTPUT"
            echo "category=" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply labels
        uses: actions/github-script@v9
        with:
          script: |
            const type = '${{ steps.detect.outputs.type }}';
            const category = '${{ steps.detect.outputs.category }}';
            const labels = ['🟢 beginner-friendly'];
            const categoryLabels = {
              cli: '💻 cli',
              web: '🌐 web',
              algorithm: '🧮 algorithm',
            };

            if (type === 'game') {
              labels.push('🎮 game');
              if (categoryLabels[category]) labels.push(categoryLabels[category]);
            } else if (type === 'translation') {
              labels.push('🌍 translation');
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            } catch (e) {
              console.log('Label error (may not exist yet):', e.message);
            }

  # ─────────────────────────────────────────────────────────
  # VALIDATE: Run unified validation script
  # ─────────────────────────────────────────────────────────
  validate:
    name: Validate Submission
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.type == 'game' || needs.detect.outputs.type == 'translation'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        id: validate
        env:
          FILES: ${{ needs.detect.outputs.files }}
        run: |
          set +e
          npx tsx scripts/validate.ts "$FILES" . > validation_result.json 2>&1
          set -e
          cat validation_result.json
          VALID=$(jq -r '.valid // false' validation_result.json 2>/dev/null || echo false)
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"

      - name: Comment results
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync('validation_result.json', 'utf8'));
            } catch {
              result = { valid: false, errors: ['Validation script failed to run'], warnings: [], security: { severity: 'safe', issues: [] } };
            }

            let body = result.valid 
              ? '## ✅ Validation Passed\n\nYour submission meets all requirements!\n'
              : '## ❌ Validation Needs Changes\n\nThanks for opening a PR. One check failed, but no worries — most first PRs need a small fix.\n\nPlease review the items below:\n\n';

            if (result.errors.length > 0) {
              body += '### Errors\n' + result.errors.map(e => `- ❌ ${e}`).join('\n') + '\n\n';
            }
            if (result.warnings.length > 0) {
              body += '### Warnings\n' + result.warnings.map(w => `- ⚠️ ${w}`).join('\n') + '\n\n';
            }
            if (result.security.issues.length > 0) {
              body += `### Security (${result.security.severity.toUpperCase()})\n`;
              body += result.security.issues.map(i => 
                `- ${i.severity === 'critical' ? '🔴' : i.severity === 'high' ? '🟠' : '🟡'} **${i.message}** in \`${i.file}:${i.line}\``
              ).join('\n') + '\n\n';
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Validation'));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (e) {
              core.warning(`Could not post validation comment: ${e.message}`);
            }

      - name: Fail on invalid
        if: steps.validate.outputs.valid == 'false'
        run: |
          echo "::error::Validation needs changes. See the friendly PR comment for what to fix."
          exit 1

  # ─────────────────────────────────────────────────────────
  # LINT: Code quality checks
  # ─────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.type == 'game'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint Python
        run: |
          pip install flake8
          git diff --name-only -z origin/${{ github.base_ref }}...HEAD -- '*.py' |
            xargs -0 -r flake8 --max-line-length=120 --ignore=E501,W503

      - name: Lint JavaScript
        run: |
          git diff --name-only -z origin/${{ github.base_ref }}...HEAD -- '*.js' |
            xargs -0 -r -n1 node --check
