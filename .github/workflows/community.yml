# ============================================================
# Community: Welcome bot, anti-spam, stale management
# Handles welcome messages, abuse signals, and stale-item cleanup.
# ============================================================
name: Community

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]
  schedule:
    - cron: '0 0 * * 1'  # Weekly cleanup on Monday

permissions:
  issues: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────
  # WELCOME: Greet new contributors
  # ─────────────────────────────────────────────────────────
  welcome:
    name: Welcome
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    steps:
      - name: Welcome contributor
        uses: actions/github-script@v9
        with:
          script: |
            const isPR = context.eventName === 'pull_request';
            const author = isPR 
              ? context.payload.pull_request.user.login 
              : context.payload.issue.user.login;
            const number = isPR 
              ? context.payload.pull_request.number 
              : context.payload.issue.number;

            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const isFirstTime = ['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR'].includes(item.author_association);

            let body = '';
            if (isFirstTime) {
              body = [
                `## 🎉 Welcome @${author}!`,
                '',
                isPR
                  ? 'Thank you for your **first contribution** to First Contribution Playground!'
                  : 'Thank you for opening your first issue in First Contribution Playground!',
                '',
                '### What happens next?',
                isPR
                  ? '1. 🤖 Automated checks will validate your submission'
                  : '1. 📋 A maintainer will review the issue',
                isPR
                  ? '2. 📋 A maintainer will review your PR'
                  : '2. 💬 We may ask for a little more detail',
                isPR
                  ? '3. ✅ Once approved, your contribution will be merged'
                  : "3. ✅ We'll confirm the next step",
                '',
                '### Resources',
                `- 📖 [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)`,
                `- 📖 [Beginner's Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/BEGINNER_GUIDE.md)`,
                `- 💬 [Discussions](https://github.com/${context.repo.owner}/${context.repo.repo}/discussions)`,
                '',
                '*Every expert was once a beginner!* 🚀',
              ].join('\n');
            } else {
              body = [
                `## 👋 Welcome back @${author}!`,
                '',
                'Great to see you contributing again! 🌟',
                '',
                isPR ? '🤖 Automated checks are running now.' : 'A maintainer will review the issue.',
              ].join('\n');
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            } catch (e) {
              core.warning(`Could not post welcome comment: ${e.message}`);
            }

  # ─────────────────────────────────────────────────────────
  # ANTI-SPAM: Rate limit and abuse detection
  # ─────────────────────────────────────────────────────────
  anti-spam:
    name: Anti-Spam
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for spam
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const prBody = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            const issues = [];

            // 1. Rate limit: Max 5 open PRs per author
            const { data: openPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const authorPRs = openPRs.filter(pr => pr.user.login === author);
            if (authorPRs.length > 5) {
              issues.push(`Rate limit: ${authorPRs.length} open PRs (max 5)`);
            }

            // 2. Account age
            try {
              const { data: user } = await github.rest.users.getByUsername({ username: author });
              const ageInDays = (Date.now() - new Date(user.created_at).getTime()) / (1000 * 60 * 60 * 24);
              if (ageInDays < 3) {
                issues.push(`New account: ${Math.floor(ageInDays)} days old`);
              }
            } catch (e) {
              core.warning(`Could not check account age: ${e.message}`);
            }

            // 3. Empty PR
            if (prBody.length < 10) {
              issues.push('PR description too short');
            }

            // 4. Empty changes
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (files.length === 0) {
              issues.push('No file changes');
            }

            // Flag suspicious activity for review. Closing a beginner's PR is a
            // maintainer decision because rate and account-age signals can be noisy.
            if (issues.length > 0) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `## ⚠️ Automated Review Notes\n\n${issues.map(i => `- ${i}`).join('\n')}\n\nThese signals are non-blocking. A maintainer will review them.`,
                });
              } catch (e) {
                core.warning(`Could not post anti-spam note: ${e.message}`);
              }
            }

  # ─────────────────────────────────────────────────────────
  # STALE: Close abandoned PRs/Issues
  # ─────────────────────────────────────────────────────────
  stale:
    name: Stale Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been marked stale due to inactivity. It will close in 7 days.'
          stale-pr-message: 'This PR has been marked stale due to inactivity. It will close in 7 days.'
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: '⏰ stale'
          stale-pr-label: '⏰ stale'
          exempt-issue-labels: '📌 pinned,🌍 translation,good first issue,claimed'
          exempt-pr-labels: '📌 pinned'
